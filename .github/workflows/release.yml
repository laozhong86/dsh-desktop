name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options: [mac, win, both]
        default: 'both'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-mac:
    if: ${{ inputs.platform == 'mac' || inputs.platform == 'both' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: plugins-source
          path: omni-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Verify version consistency
        run: node scripts/verify-version.mjs
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Stage preset
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}/omni-source/plugins
        run: corepack yarn workspace dsh-plugin-desktop stage:preset
      - name: Verify staged preset
        # The artifact, not the intent: a preset whose record disagrees with the
        # packages it ships must fail here, not on a user machine.
        run: |
          cd dsh-plugin-desktop
          node scripts/verify-distribution.ts --preset preset
      - name: Build macOS release (arm64 DMG)
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}/omni-source/plugins
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          corepack yarn workspace dsh-plugin-desktop build
          cd dsh-plugin-desktop
          node node_modules/electron-builder/cli.js --mac dmg --arm64 --publish never \
            --config.mac.notarize=false --config.npmRebuild=false \
            --config.directories.output=dist/mac-arm64-release
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OmniMux-mac
          path: |
            dsh-plugin-desktop/dist/mac-arm64-release/**/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-win:
    if: ${{ inputs.platform == 'win' || inputs.platform == 'both' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: plugins-source
          path: omni-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Verify version consistency
        run: node scripts/verify-version.mjs
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Stage preset
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}\omni-source\plugins
        run: corepack yarn workspace dsh-plugin-desktop stage:preset
      - name: Verify staged preset
        # The artifact, not the intent: a preset whose record disagrees with the
        # packages it ships must fail here, not on a user machine.
        run: |
          cd dsh-plugin-desktop
          node scripts/verify-distribution.ts --preset preset
      - name: Build Windows installer (website unsigned)
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}\omni-source\plugins
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: corepack yarn workspace dsh-plugin-desktop dist:win
      - name: Verify Windows installer
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}\omni-source\plugins
        run: corepack yarn workspace dsh-plugin-desktop check:win-package
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: OmniMux-win
          path: |
            dsh-plugin-desktop/dist/OmniMux-*.exe
            dsh-plugin-desktop/dist/OmniMux-*.zip
            dsh-plugin-desktop/dist/win-unpacked
          if-no-files-found: error
          retention-days: 14

  # 发布到 GitHub Releases：把产物从 14 天临时 artifact 升级为持久、可追溯的
  # 分发资产，同时是 electron-updater 自动更新链路的 feed 地基。
  # 当前决策：Windows 以官网 unsigned NSIS 为主；Microsoft Store / Trusted Signing
  # 付费签名路径暂停，见 docs/contracts/release-sop.md。
  publish:
    needs: [build-mac, build-win]
    if: ${{ always() && (needs.build-mac.result == 'success' || needs.build-win.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniMux ${{ steps.version.outputs.tag }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.zip
          fail_on_unmatched_files: false
      - name: Sync to Cloudflare R2 (dl.omnimux.ai)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/r2-dist-sync.mjs upload --dir release-assets
