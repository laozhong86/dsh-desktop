name: macOS + Windows signed release (private source)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which artifact to build
        type: choice
        options: [mac-arm64, mac-x64, mac-both, win, all]
        default: mac-arm64
permissions:
  contents: read

jobs:
  build-mac-arm64:
    if: ${{ inputs.target == 'mac-arm64' || inputs.target == 'mac-both' || inputs.target == 'all' }}
    runs-on: macos-latest
    # A hung step used to sit for 2.5 hours; fail fast instead of burning the runner.
    timeout-minutes: 80
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: omnimux
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          path: src
      - name: Check out private plugin source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: plugins-source
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false
          path: plugins-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: src
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere release artifact
        working-directory: src
        run: |
          # 发布门禁要求桥接件出自官方 AA main 的最新提交，CI 里必须现场刷新。
          corepack yarn aa:prepare-release
      - name: Import Developer ID certificate
        working-directory: src
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > developerID_application.p12
          security create-keychain -p "github-actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github-actions" build.keychain
          security import developerID_application.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions" build.keychain
          security find-identity -v build.keychain
      - name: Build arm64
        working-directory: src
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}/plugins-src/plugins
          CSC_NAME: 'Yuhang Zhong (XXK6GHRZ44)'
          DSH_MAC_RELEASE_ARCH: arm64
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn workspace dsh-desktop-next dist:mac
      - name: Upload arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: OmniMux-mac-arm64
          path: src/dsh-desktop-next/dist/mac-release/*arm64*.dmg
          if-no-files-found: error
          retention-days: 14

  build-mac-x64:
    if: ${{ inputs.target == 'mac-x64' || inputs.target == 'mac-both' || inputs.target == 'all' }}
    # Build x86_64 on a native Intel runner: on arm64 macos-latest every compile and
    # codesign call runs under Rosetta and the x64 package blew past the job timeout.
    # Must also be macOS 26: electron-builder needs actool >= 26.0, and the macOS 15
    # Intel image only ships Xcode 16.4.
    runs-on: macos-26-intel
    # Standard Intel runners are ~4 vCPUs; the full monorepo gate plus packaging
    # legitimately runs longer than the arm64 runner needs.
    timeout-minutes: 120
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: omnimux
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          path: src
      - name: Check out private plugin source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: plugins-source
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false
          path: plugins-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: src
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere release artifact
        working-directory: src
        run: |
          corepack yarn aa:prepare-release
      - name: Import Developer ID certificate
        working-directory: src
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > developerID_application.p12
          security create-keychain -p "github-actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github-actions" build.keychain
          security import developerID_application.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "github-actions" build.keychain
          security find-identity -v build.keychain
      - name: Build x64
        working-directory: src
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}/plugins-src/plugins
          CSC_NAME: 'Yuhang Zhong (XXK6GHRZ44)'
          DSH_MAC_RELEASE_ARCH: x64
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack yarn workspace dsh-desktop-next dist:mac
      - name: Upload x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: OmniMux-mac-x64
          path: src/dsh-desktop-next/dist/mac-release/*x64*.dmg
          if-no-files-found: error
          retention-days: 14

  build-win:
    if: ${{ inputs.target == 'win' || inputs.target == 'all' }}
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: omnimux
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          path: src
      - name: Check out private plugin source
        uses: actions/checkout@v4
        with:
          repository: laozhong86/omnimux-desktop-fork
          ref: plugins-source
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false
          path: plugins-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: src
        run: corepack yarn install --immutable
      - name: Refresh Agents Anywhere release artifact
        working-directory: src
        run: |
          corepack yarn aa:prepare-release
      - name: Build Windows installer
        working-directory: src
        env:
          OMNIMUX_PLUGINS_DIR: ${{ github.workspace }}\plugins-src\plugins
        run: corepack yarn workspace dsh-desktop-next dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OmniMux-win-x64
          path: |
            src/dsh-desktop-next/dist/**/*.exe
            src/dist/**/*.exe
          if-no-files-found: error
          retention-days: 14
